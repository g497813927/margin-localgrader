name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-core:
    name: Python and UI checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      DO_NOT_TRACK: "1"
      OTEL_SDK_DISABLED: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install application and synthetic-test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test portable image and local inference boundaries
        run: >-
          python -m pytest -q
          tests/test_visual_inputs.py
          tests/test_visual_detection.py
          tests/test_pdf_visual_regions.py
          tests/test_vision.py
          tests/test_vision_crops.py
          tests/test_windows_workspace.py
          tests/test_visual_errors.py
          tests/test_vision_setup.py
          tests/test_d3_server.py
          tests/test_d3_portability.py
      - name: Test browser workflow with synthetic fixtures
        run: node tests/frontend.cjs

  optional-decision-runtime:
    name: Optional decision runtime (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      DO_NOT_TRACK: "1"
      OTEL_SDK_DISABLED: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          from grader.dependency_pins import pinned_version
          torch_version = pinned_version(Path('requirements-candidates.txt'), 'torch')
          subprocess.run([sys.executable, '-m', 'pip', 'install', f'torch=={torch_version}',
                          '--index-url', 'https://download.pytorch.org/whl/cpu'], check=True)
          PY
      - name: Install optional decision runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-laya.txt
      - name: Test local runtime contracts with synthetic inputs
        run: python -m pytest -q tests/test_providers.py tests/test_d3_server.py tests/test_d3_portability.py
