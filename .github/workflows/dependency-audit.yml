name: Dependency audit

on:
  push:
    paths:
      - "requirements*.txt"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned audit tool
        run: python -m pip install -r requirements-audit.txt
      - name: Audit application and test dependencies
        run: python -m pip_audit --strict -r requirements-dev.txt
      - name: Audit optional decision model dependencies
        run: python -m pip_audit --strict -r requirements-laya.txt
      - name: Audit maintenance tooling
        run: python -m pip_audit --strict -r requirements-audit.txt
